org.gradle.jvmargs=-Xmx2G
org.gradle.workers.max=2
org.gradle.configureondemand=true
org.gradle.configuration-cache=false
org.gradle.caching=true

# Build tooling
moddevgradle_version=2.0.147-tau.2
stonecutter_version=0.10
junit_version=6.1.3
jmh_version=1.37

# Build-only libraries; these are not bundled into the mod.
build_jgit_version=7.8.1.202611041320-r
build_guava_version=33.8.0-jre
build_asm_version=9.11.1
build_gson_version=2.15.0
build_commons_compress_version=1.28.0

mod_package=org.embeddedt.embeddium
mod_id=embeddium
mod_display_name=Nocturna
mod_description=An open-source client performance mod for Minecraft
# Comma separated, i.e.: "Person A,Person B,Person C"
mod_authors=embeddedt,Sumire Labs
mod_contributors=jellysquid3
license=LGPL-3.0

homepage_url=https://github.com/Sumire-Labs/Nocturna
sources_url=https://github.com/Sumire-Labs/Nocturna
issue_tracker_url=https://github.com/Sumire-Labs/Nocturna/issues

glsl_transformation_lib_version=0.2.0-37.ga0069bf

# Matches the JOML provided by Minecraft 1.20.1.
joml_version=1.10.5
lombok_version=1.18.48

minecraft_dependency_1_20_1=1.20.1

parchment_version_1_20_1=1.20.1:2023.09.03
# If this is blank, the stock version is used. This also bundles mixinextras into the JAR file if it is not the same as the stock version.
mixinextras=0.5.5

# Compile-only Fabric/Connector compatibility for the Forge renderer
fabricloader=0.20.1
fabric_api_modules=fabric-api-base,fabric-resource-loader-v0,fabric-key-binding-api-v1,fabric-block-view-api-v2,fabric-rendering-fluids-v1,fabric-renderer-api-v1,fabric-rendering-data-attachment-v1,fabric-renderer-indigo

ffapi_1_20_1=0.92.6+1.11.15+1.20.1

# Forge Stuff
forge_1_20_1=1.20.1-47.3.0

# Flywheel (compiled against for the in-tree shader backend)
flywheel_version_1_20_1=1.0.6

# Keep the public 1.20.1 addon version range.
mod_version=0.3.31
minecraft_version=1.20.1
base_mc_version_commit=0263cc2ffd33599aa90d5b226242035459e45ee7
