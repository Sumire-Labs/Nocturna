name: RSO native input
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-input:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare SDL resources
        run: ./gradlew :modern:1.20.1-forge:rsoSdlResources --no-daemon
      - name: Install X11 test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxrandr2 libxinerama1 libxcursor1 libxi6 libgl1-mesa-dri
      - name: Run Linux native input checks
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a node scripts/run-rso-native-input.mjs '${{ steps.java17.outputs.path }}' run modern/versions/1.20.1-forge/build/generated/rsoSdlResources
      - name: Run macOS native input checks
        if: runner.os == 'macOS'
        run: node scripts/run-rso-native-input.mjs '${{ steps.java17.outputs.path }}' run modern/versions/1.20.1-forge/build/generated/rsoSdlResources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-input-${{ runner.os }}
          path: build/audits/rso-native/**/native-input.txt
