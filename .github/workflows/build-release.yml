name: build-release
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew build -Pbuild.release=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Embeddium-1.20.1-Forge-release
          path: build/libs/**/*.jar
