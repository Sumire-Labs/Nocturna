name: build-snapshot
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Embeddium-1.20.1-Forge
          path: build/libs/**/*.jar
      - uses: coactions/setup-xvfb@v1
        with:
          run: ./gradlew :modern:1.20.1-forge:runValidationClient --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Validation
          path: |
            common/build/reports/tests
            modern/versions/1.20.1-forge/build/reports/tests
            modern/versions/1.20.1-forge/run/migration-validation.txt
            modern/versions/1.20.1-forge/run/logs
